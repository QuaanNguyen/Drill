name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: drill --help
      - run: python tools/verify.py --output .checks/verification.json
      - run: python -m pip wheel --no-deps --wheel-dir .checks/dist .
      - run: python tools/check_package.py .checks/dist/*.whl
